coverage:
  status:
    project:
      default:
        target: 85%
        threshold: 1%
        informational: false
        only_pulls: false
    patch:
      default:
        target: 85%
        threshold: 1%
        informational: false

comment:
  layout: 'reach,diff,flags,tree'
  behavior: default
  require_changes: false

ignore:
  - 'tests/'
  - 'benches/'
  - 'examples/'
