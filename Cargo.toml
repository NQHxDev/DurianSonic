[package]
name = "durian-sonic"
version = "0.1.0"
edition = "2021"
authors = ["NQHxDev"]
license = "MIT OR Apache-2.0"

[lib]
name = "durian_sonic"
path = "src/lib.rs"

[[bin]]
name = "durian-sonic"
path = "src/main.rs"

[dependencies]
# CLI & Config
clap = { version = "4.6.9", features = ["derive"] }
toml = "1.2.2"

# Data Handling & Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
csv = "1.4.0"

# Audio Decoding & DSP
symphonia = { version = "0.6.1", features = ["aac", "isomp4", "pcm", "wav"] }
rubato = "5.1.0"
realfft = "3.5.1"
ndarray = "0.17.2"
sha2 = "0.11.1"

# Deep Learning in Rust (Burn Framework)
burn = { version = "0.22.1", features = ["train", "wgpu", "ndarray", "autodiff", "metrics"] }

# Logging & Error Handling
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
anyhow = "1.0.105"
thiserror = "2.0.21"
rand = "0.10.4"

[dev-dependencies]
criterion = "0.8.2"
approx = "0.5.1"
tempfile = "3.27.0"

[[bench]]
name = "training_benchmarks"
harness = false
