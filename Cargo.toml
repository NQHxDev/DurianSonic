[package]
name = "durian-sonic"
version = "0.1.0"
edition = "2021"
authors = ["NQHxDev"]
license = "MIT OR Apache-2.0"

[lib]
name = "durian_sonic"
path = "src/lib.rs"

[[bin]]
name = "durian-sonic"
path = "src/main.rs"

[dependencies]
# CLI & Config
clap = { version = "4.6", features = ["derive"] }
toml = "1.2"

# Data Handling
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
csv = "1.4.0"

# Logging
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

# Error handling
anyhow = "1.0.104"
thiserror = "2.0.21"

[dev-dependencies]
criterion = "0.8.2"
approx = "0.5.1"
tempfile = "3.27.0"

[[bench]]
name = "training_benchmarks"
harness = false
